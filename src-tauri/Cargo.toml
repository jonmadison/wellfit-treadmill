[package]
name = "wellfit-tm"
version = "0.1.1"
description = "WELLFIT TM treadmill control"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
